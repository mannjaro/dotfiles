# 設定変更後すぐ反映できるようにする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# PrefixをCtrl-bからCtrl-qに変更
set -g prefix C-q
unbind C-b

set -g base-index 1          # ウィンドウ番号を1始まりに
setw -g pane-base-index 1    # ペイン番号も1始まりに
set -g mouse on

# tmuxを256色+TrueColor対応にする
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# Vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインリサイズ（vim風）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# | でペインを縦に分割する
bind | split-window -h -c "#{pane_current_path}"
# - でペインを横に分割する
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# コピーモード（vi風）
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# macOS の場合（pbcopy連携）
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ステータスバー
set -g status-position top
set -g status-style "bg=colour235,fg=colour136"
set -g status-left "#[fg=colour232,bg=colour136] #S "
set -g status-right "#[fg=colour136] %Y-%m-%d %H:%M "
set -g status-left-length 30